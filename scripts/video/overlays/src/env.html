<!doctype html><html><head><meta charset="utf-8"><title>env</title>
<link rel="stylesheet" href="common.css"><style>html,body{background:#000}canvas{position:absolute;left:0;top:0;width:1920px;height:1080px}</style></head>
<body><canvas id="c"></canvas>
<script src="common.js"></script><script src="bokeh.js"></script>
<script>
